<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Technical and functional software architecture</title>
  <desc id="desc">Technical architecture organises technologies and infrastructure, while functional architecture organises cohesive system responsibilities.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .question { font: 600 20px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #172033; }
      .body { font: 17px Arial, sans-serif; fill: #475569; }
      .footer { font: 600 19px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <g transform="translate(45 35)">
    <rect width="530" height="450" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="265" y="48" text-anchor="middle" class="title">Technical architecture</text>
    <text x="265" y="82" text-anchor="middle" class="question">What is the system built from?</text>

    <rect x="125" y="115" width="280" height="70" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="265" y="145" text-anchor="middle" class="box-title">User interface</text>
    <text x="265" y="170" text-anchor="middle" class="body">Web or mobile client</text>

    <line x1="265" y1="185" x2="265" y2="220" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="125" y="225" width="280" height="70" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="265" y="255" text-anchor="middle" class="box-title">Application services</text>
    <text x="265" y="280" text-anchor="middle" class="body">APIs and business services</text>

    <line x1="265" y1="295" x2="265" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="45" y="335" width="200" height="70" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="145" y="365" text-anchor="middle" class="box-title">Data storage</text>
    <text x="145" y="390" text-anchor="middle" class="body">Database</text>

    <rect x="285" y="335" width="200" height="70" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="385" y="365" text-anchor="middle" class="box-title">Infrastructure</text>
    <text x="385" y="390" text-anchor="middle" class="body">Cloud and network</text>

    <line x1="265" y1="330" x2="145" y2="335" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="265" y1="330" x2="385" y2="335" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(625 35)">
    <rect width="530" height="450" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="265" y="48" text-anchor="middle" class="title">Functional architecture</text>
    <text x="265" y="82" text-anchor="middle" class="question">What responsibilities does it contain?</text>

    <rect x="35" y="120" width="215" height="120" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="142" y="155" text-anchor="middle" class="box-title">Accounts</text>
    <text x="142" y="185" text-anchor="middle" class="body">Authentication</text>
    <text x="142" y="210" text-anchor="middle" class="body">User profiles</text>

    <rect x="280" y="120" width="215" height="120" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="387" y="155" text-anchor="middle" class="box-title">Projects</text>
    <text x="387" y="185" text-anchor="middle" class="body">Create and update</text>
    <text x="387" y="210" text-anchor="middle" class="body">Assign members</text>

    <rect x="35" y="275" width="215" height="120" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="142" y="310" text-anchor="middle" class="box-title">Reporting</text>
    <text x="142" y="340" text-anchor="middle" class="body">Metrics</text>
    <text x="142" y="365" text-anchor="middle" class="body">Export results</text>

    <rect x="280" y="275" width="215" height="120" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="387" y="310" text-anchor="middle" class="box-title">Notifications</text>
    <text x="387" y="340" text-anchor="middle" class="body">Create alerts</text>
    <text x="387" y="365" text-anchor="middle" class="body">Deliver messages</text>
  </g>

  <text x="300" y="530" text-anchor="middle" class="footer">Technologies, components, and deployment</text>
  <text x="900" y="530" text-anchor="middle" class="footer">Cohesive areas of system behaviour</text>
</svg>
