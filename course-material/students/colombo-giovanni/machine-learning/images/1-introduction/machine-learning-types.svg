<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning types covered by the module</title>
  <desc id="desc">Machine learning branches into supervised and unsupervised machine learning. Supervised machine learning includes classification and regression.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #172033; }
      .node-title { font: 700 22px system-ui, sans-serif; fill: #172033; }
      .body { font: 17px system-ui, sans-serif; fill: #475569; }
      .example { font: 16px system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Machine learning in this module</text>

  <rect x="430" y="78" width="340" height="84" rx="18" fill="#e8f2ff" stroke="#3973b9" stroke-width="3"/>
  <text x="600" y="130" text-anchor="middle" class="node-title">Machine Learning</text>

  <line x1="535" y1="162" x2="330" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="665" y1="162" x2="870" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="260" width="420" height="112" rx="18" fill="#e9f8ed" stroke="#398a55" stroke-width="3"/>
  <text x="330" y="306" text-anchor="middle" class="node-title">Supervised Machine Learning</text>
  <text x="330" y="340" text-anchor="middle" class="body">Main focus — learns from labelled data</text>

  <rect x="660" y="260" width="420" height="112" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="870" y="306" text-anchor="middle" class="node-title">Unsupervised Machine Learning</text>
  <text x="870" y="340" text-anchor="middle" class="body">Covered briefly towards the end</text>

  <line x1="270" y1="372" x2="250" y2="450" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="372" x2="440" y2="450" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="465" width="390" height="140" rx="18" fill="#fff4d6" stroke="#c78616" stroke-width="3"/>
  <text x="250" y="510" text-anchor="middle" class="node-title">Classification</text>
  <text x="250" y="544" text-anchor="middle" class="body">Predicts a discrete class</text>
  <text x="250" y="576" text-anchor="middle" class="example">Example: fraudulent / not fraudulent</text>

  <rect x="470" y="465" width="390" height="140" rx="18" fill="#f5edff" stroke="#8250b5" stroke-width="3"/>
  <text x="665" y="510" text-anchor="middle" class="node-title">Regression</text>
  <text x="665" y="544" text-anchor="middle" class="body">Predicts a continuous value</text>
  <text x="665" y="576" text-anchor="middle" class="example">Example: estimated distance</text>
</svg>
