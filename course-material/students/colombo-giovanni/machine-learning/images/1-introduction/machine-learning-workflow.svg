<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Machine learning workflow</title>
  <desc id="description">Data preparation leads to feature selection. Model selection, training, and testing form an iterative cycle before the model is used in a business application. Feedback from the application can restart data preparation.</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 Z" fill="#536273"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="780" fill="#ffffff"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#172033" font-size="38" font-weight="700">Machine learning workflow</text>
    <text x="800" y="98" text-anchor="middle" fill="#667085" font-size="19">Model development is iterative, and deployment can reveal the need for better data.</text>

    <g fill="none" stroke="#536273" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M 320 360 L 480 360"/>
      <path d="M 590 315 C 590 235, 630 188, 710 188"/>
      <path d="M 890 188 C 970 188, 1010 235, 1010 315"/>
      <path d="M 1010 405 C 1010 485, 970 533, 890 533"/>
      <path d="M 710 533 C 630 533, 590 485, 590 405"/>
      <path d="M 1120 360 L 1260 360"/>
      <path d="M 1400 405 C 1400 695, 310 742, 190 405"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="60" y="315" width="260" height="90" rx="22" fill="#dceccb" stroke="#7ba05b" stroke-width="2.5"/>
      <rect x="480" y="315" width="220" height="90" rx="22" fill="#e7f1dc" stroke="#7ba05b" stroke-width="2.5"/>
      <rect x="710" y="145" width="180" height="85" rx="22" fill="#e7f1dc" stroke="#7ba05b" stroke-width="2.5"/>
      <rect x="900" y="315" width="220" height="90" rx="22" fill="#e7f1dc" stroke="#7ba05b" stroke-width="2.5"/>
      <rect x="710" y="490" width="180" height="85" rx="22" fill="#e7f1dc" stroke="#7ba05b" stroke-width="2.5"/>
      <rect x="1260" y="315" width="280" height="90" rx="22" fill="#dceccb" stroke="#7ba05b" stroke-width="2.5"/>
    </g>

    <g fill="#25313f" font-size="24" font-weight="650" text-anchor="middle">
      <text x="190" y="369">Data Preparation</text>
      <text x="590" y="369">Choose Features</text>
      <text x="800" y="196">Select Model</text>
      <text x="1010" y="369">Train Model</text>
      <text x="800" y="541">Test Model</text>
      <text x="1400" y="369">Business Application</text>
    </g>

    <g text-anchor="middle">
      <text x="190" y="275" fill="#476632" font-size="19" font-weight="700">Often the bulk of the effort</text>
      <text x="1400" y="275" fill="#476632" font-size="19" font-weight="700">What ultimately creates value</text>
      <text x="800" y="354" fill="#667085" font-size="17" font-weight="600">Iterative model</text>
      <text x="800" y="378" fill="#667085" font-size="17" font-weight="600">development</text>
      <text x="800" y="718" fill="#667085" font-size="17">Real-world feedback may trigger another round of data preparation.</text>
    </g>
  </g>
</svg>
