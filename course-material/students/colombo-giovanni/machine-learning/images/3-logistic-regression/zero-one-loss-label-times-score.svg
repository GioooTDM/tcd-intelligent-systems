<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">0–1 loss: count the mistakes</title>
<desc id="desc">The loss is one when true label times score is negative and zero when that product is positive. It is flat on either side of zero and jumps at the decision boundary; the value at zero depends on the classifier tie rule.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#41566d"/></marker></defs>
<rect width="900" height="400" rx="18" fill="#f5f8fb"/>
<text x="34.0" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#26384b" font-weight="700">0–1 loss: count the mistakes</text>
<text x="34.0" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >True label × score (y · z): negative means wrong, positive means correct</text>
<rect x="104" y="92" width="358.0" height="227" fill="#fff0ee"/>
<rect x="462.0" y="92" width="358.0" height="227" fill="#eef6fc"/>
<text x="283.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a33f38" font-weight="700" text-anchor="middle">Wrong class</text>
<text x="641.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#21648f" font-weight="700" text-anchor="middle">Correct class</text>
<line x1="462.0" y1="92" x2="462.0" y2="319" stroke="#2e9867" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="98" y1="319.0" x2="110" y2="319.0" stroke="#41566d" stroke-width="1.5"/>
<text x="86.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">0</text>
<line x1="98" y1="156.9" x2="110" y2="156.9" stroke="#41566d" stroke-width="1.5"/>
<text x="86.0" y="161.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">1</text>
<line x1="104" y1="319" x2="830" y2="319" stroke="#41566d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="104" y1="319" x2="104" y2="84" stroke="#41566d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35.0" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle" transform="rotate(-90 35 205)">loss per example</text>
<text x="462.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#26384b" text-anchor="middle">true label × score (y · z)</text>
<line x1="104.0" y1="313" x2="104.0" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="104.0" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">−3</text>
<line x1="223.3" y1="313" x2="223.3" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="223.3" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">−2</text>
<line x1="342.7" y1="313" x2="342.7" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="342.7" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">−1</text>
<line x1="462.0" y1="313" x2="462.0" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="462.0" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">0</text>
<line x1="581.3" y1="313" x2="581.3" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="581.3" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">1</text>
<line x1="700.7" y1="313" x2="700.7" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="700.7" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">2</text>
<line x1="820.0" y1="313" x2="820.0" y2="325" stroke="#41566d" stroke-width="1.5"/>
<text x="820.0" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">3</text>
<line x1="104" y1="156.9" x2="456.0" y2="156.9" stroke="#344a61" stroke-width="4"/>
<line x1="468.0" y1="319.0" x2="820" y2="319.0" stroke="#344a61" stroke-width="4"/>
<circle cx="462.0" cy="156.9" r="5" fill="#fff" stroke="#344a61" stroke-width="2.5"/>
<circle cx="462.0" cy="319.0" r="5" fill="#fff" stroke="#344a61" stroke-width="2.5"/>
<text x="283.0" y="142.9" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle">loss = 1</text>
<text x="641.0" y="305.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle">loss = 0</text>
</svg>
