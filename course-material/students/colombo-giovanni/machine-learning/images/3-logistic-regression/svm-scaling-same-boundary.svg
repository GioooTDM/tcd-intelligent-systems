<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc">
<title id="title">Scaling SVM parameters leaves the decision boundary unchanged</title>
<desc id="desc">The score lines x minus three and two x minus six cross zero at the same feature value, three. For a positive example at feature value 3.5, doubling the parameters raises the score from 0.5 to 1 and reduces hinge loss from 0.5 to zero without changing the predicted class.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#41566d"/></marker></defs>
<rect width="900" height="425" rx="18" fill="#f5f8fb"/>
<text x="34.0" y="45.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#26384b" font-weight="700">Same boundary, different scores</text>
<text x="34.0" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >Scaling the parameters changes the score but not the prediction.</text>
<rect x="24" y="89" width="852" height="307" rx="16" fill="#fff" stroke="#d9e3ec"/>
<rect x="130.0" y="135" width="235.0" height="200" fill="#fff0ee"/>
<rect x="365.0" y="135" width="235.0" height="200" fill="#eef6fc"/>
<line x1="365.0" y1="135" x2="365.0" y2="335" stroke="#2e9867" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="365.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#23724d" font-weight="700" text-anchor="middle">boundary x₁ = 3</text>
<line x1="124" y1="325.0" x2="136" y2="325.0" stroke="#41566d" stroke-width="1.5"/>
<text x="116.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">−2</text>
<line x1="124" y1="280.0" x2="136" y2="280.0" stroke="#41566d" stroke-width="1.5"/>
<text x="116.0" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">−1</text>
<line x1="124" y1="235.0" x2="136" y2="235.0" stroke="#41566d" stroke-width="1.5"/>
<text x="116.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">0</text>
<line x1="124" y1="190.0" x2="136" y2="190.0" stroke="#41566d" stroke-width="1.5"/>
<text x="116.0" y="195.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">1</text>
<line x1="124" y1="145.0" x2="136" y2="145.0" stroke="#41566d" stroke-width="1.5"/>
<text x="116.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="end">2</text>
<line x1="130.0" y1="230" x2="130.0" y2="241" stroke="#41566d" stroke-width="1.5"/>
<text x="130.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">2</text>
<line x1="365.0" y1="230" x2="365.0" y2="241" stroke="#41566d" stroke-width="1.5"/>
<text x="365.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">3</text>
<line x1="600.0" y1="230" x2="600.0" y2="241" stroke="#41566d" stroke-width="1.5"/>
<text x="600.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">4</text>
<line x1="130.0" y1="280.0" x2="600.0" y2="190.0" stroke="#344a61" stroke-width="3.5"/>
<line x1="130.0" y1="325.0" x2="600.0" y2="145.0" stroke="#c46a28" stroke-width="3.5"/>
<line x1="482.5" y1="190.0" x2="482.5" y2="235.0" stroke="#8292a3" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="482.5" cy="190.0" r="6" fill="#c46a28" stroke="#fff" stroke-width="2"/>
<circle cx="482.5" cy="212.5" r="6" fill="#344a61" stroke="#fff" stroke-width="2"/>
<line x1="130.0" y1="235.0" x2="609.0" y2="235.0" stroke="#41566d" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="130.0" y1="335" x2="130.0" y2="128" stroke="#41566d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365.0" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle">feature x₁</text>
<text x="49.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle" transform="rotate(-90 49 235)">score θᵀx</text>
<line x1="496" y1="190" x2="637" y2="168" stroke="#c46a28" stroke-width="1.5"/>
<line x1="496" y1="212.5" x2="637" y2="255" stroke="#344a61" stroke-width="1.5"/>
<rect x="640" y="137" width="213" height="64" rx="10" fill="#fff7f0" stroke="#e9c9ad"/>
<text x="654.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9d501e" font-weight="700">2θ: score 1</text>
<text x="654.0" y="187.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9d501e" >hinge loss 0</text>
<rect x="640" y="229" width="213" height="64" rx="10" fill="#f2f6fa" stroke="#ccd9e4"/>
<text x="654.0" y="254.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#344a61" font-weight="700">θ: score 0.5</text>
<text x="654.0" y="279.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" >hinge loss 0.5</text>
<text x="747.0" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526273" text-anchor="middle">Example: x₁ = 3.5, y = +1</text>
</svg>
