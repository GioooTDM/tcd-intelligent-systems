<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Logistic cost for ten labelled emails</title>
<desc id="desc">The upper plot shows five normal and five spam emails at different spam-keyword counts. With slope one and intercept minus four point five, the boundary lies between counts four and five; a spam email at four and a normal email at six are misclassified. The lower plot shows their average logistic cost as the intercept changes. It is convex and has a minimum near minus four point five.</desc>
