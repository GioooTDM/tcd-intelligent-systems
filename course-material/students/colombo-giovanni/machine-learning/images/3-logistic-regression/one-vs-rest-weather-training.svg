<text x="360" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="487" y="327" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="520" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="647" y="327" width="66" height="36" rx="9" fill="#e4f4eb"/>
<text x="680" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#227d56" font-weight="700" text-anchor="middle">+1</text>
<rect x="807" y="327" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="840" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<text x="180" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" font-weight="700" text-anchor="middle">Snow (3)</text>
<rect x="327" y="395" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="360" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="487" y="395" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="520" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="647" y="395" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="680" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="807" y="395" width="66" height="36" rx="9" fill="#e4f4eb"/>
<text x="840" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#227d56" font-weight="700" text-anchor="middle">+1</text>
<text x="500" y="484" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" text-anchor="middle">Train one binary classifier from each relabelled column.</text>
