<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">One-vs-rest training labels for four weather classes</title>
<desc id="desc">Four weather classes have original labels zero through three. In each one-vs-rest binary training column, the named class becomes plus one and all other classes become minus one.</desc>
<rect width="1000" height="510" rx="18" fill="#f5f8fb"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#26384b" font-weight="700">One-vs-rest: relabel weather classes</text>
<text x="40" y="77" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526273" >Original classes use 0–3; each binary classifier uses +1 for its class and −1 for the rest.</text>
<rect x="80" y="120" width="840" height="326" rx="14" fill="#fff" stroke="#d9e3ec"/>
<path d="M80 134 Q80 120 94 120 H906 Q920 120 920 134 V174 H80 Z" fill="#e9f0f6"/>
<text x="180" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344a61" font-weight="700" text-anchor="middle">Original y</text>
<text x="360" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344a61" font-weight="700" text-anchor="middle">Sunny vs rest</text>
<text x="520" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344a61" font-weight="700" text-anchor="middle">Cloudy vs rest</text>
<text x="680" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344a61" font-weight="700" text-anchor="middle">Rain vs rest</text>
<text x="840" y="153" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#344a61" font-weight="700" text-anchor="middle">Snow vs rest</text>
<line x1="280" y1="120" x2="280" y2="446" stroke="#d9e3ec"/>
<line x1="440" y1="120" x2="440" y2="446" stroke="#d9e3ec"/>
<line x1="600" y1="120" x2="600" y2="446" stroke="#d9e3ec"/>
<line x1="760" y1="120" x2="760" y2="446" stroke="#d9e3ec"/>
<line x1="80" y1="174" x2="920" y2="174" stroke="#d9e3ec"/>
<line x1="80" y1="242" x2="920" y2="242" stroke="#d9e3ec"/>
<line x1="80" y1="310" x2="920" y2="310" stroke="#d9e3ec"/>
<line x1="80" y1="378" x2="920" y2="378" stroke="#d9e3ec"/>
<text x="180" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" font-weight="700" text-anchor="middle">Sunny (0)</text>
<rect x="327" y="191" width="66" height="36" rx="9" fill="#e4f4eb"/>
<text x="360" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#227d56" font-weight="700" text-anchor="middle">+1</text>
<rect x="487" y="191" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="520" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="647" y="191" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="680" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<rect x="807" y="191" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="840" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
<text x="180" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344a61" font-weight="700" text-anchor="middle">Cloudy (1)</text>
