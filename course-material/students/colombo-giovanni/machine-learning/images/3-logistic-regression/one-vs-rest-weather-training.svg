<text x="520" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#227d56" font-weight="700" text-anchor="middle">+1</text>
<rect x="647" y="259" width="66" height="36" rx="9" fill="#f1f4f7"/>
<text x="680" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6b7886" font-weight="700" text-anchor="middle">−1</text>
