<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
<title id="title">Hinge and logistic loss by true label</title>
<desc id="desc">Two graphs compare dark hinge loss with orange logistic loss against score theta transpose x. Logistic loss is divided by log 2 to match the lecture slides. For true label plus one, hinge loss falls to zero at score plus one; for true label minus one, it is zero up to score minus one. Logistic loss decreases smoothly towards zero but does not reach it. The green dashed line marks score zero.</desc>
