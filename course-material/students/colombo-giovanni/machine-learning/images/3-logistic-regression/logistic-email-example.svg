<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc">
<title id="title">One spam email: logistic loss falls as its score improves</title>
<desc id="desc">An email with two spam keywords and true label plus one is evaluated with slope one and four intercepts. As the score changes from minus two to minus one, the prediction stays negative, but the logistic penalty falls from 2.13 to 1.31. At scores zero and plus one, the prediction is positive and the penalty falls further.</desc>
