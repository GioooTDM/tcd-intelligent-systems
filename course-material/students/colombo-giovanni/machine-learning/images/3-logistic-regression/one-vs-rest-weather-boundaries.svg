<title id="title">Four weather classes viewed as one-vs-rest classifiers</title>
<desc id="desc">The top plot contains illustrative Sunny, Cloudy, Rain, and Snow clusters in temperature and precipitation space. Four lower plots each highlight one class as positive, leave all other examples hollow and negative, and show a separate linear decision boundary.</desc>
