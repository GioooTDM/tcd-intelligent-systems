<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">One-vs-rest prediction for a new weather observation</title>
<desc id="desc">A new cool, overcast day is evaluated by four binary classifiers. Sunny scores minus one point two, Cloudy plus one point three, Rain minus zero point four, and Snow minus one point five. Cloudy has the highest score and is selected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#41566d"/></marker></defs>
<rect width="1100" height="490" rx="18" fill="#f5f8fb"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#26384b" font-weight="700">One-vs-rest: classify a new day</text>
<text x="40" y="77" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526273" >Illustrative scores from four trained classifiers; scores are not probabilities.</text>
<rect x="35" y="196" width="278" height="106" rx="15" fill="#fff" stroke="#d9e3ec"/>
<text x="58" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526273" >New observation</text>
<text x="58" y="264" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26384b" font-weight="700">Cool, overcast</text>
<path d="M313 249 H355 M355 138 V378" fill="none" stroke="#9fb0bf" stroke-width="2"/>
<line x1="355" y1="138" x2="390" y2="138" stroke="#9fb0bf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="108" width="315" height="60" rx="12" fill="#fff" stroke="#d9e3ec"/>
<text x="410" y="133" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26384b" font-weight="700">Sunny vs rest</text>
<text x="410" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >score −1.2  →  sign −1</text>
<line x1="705" y1="138" x2="750" y2="138" stroke="#9fb0bf" stroke-width="2"/>
<line x1="355" y1="218" x2="390" y2="218" stroke="#9fb0bf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="188" width="315" height="60" rx="12" fill="#eaf7ef" stroke="#2e9867"/>
<text x="410" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26384b" font-weight="700">Cloudy vs rest</text>
<text x="410" y="235" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >score +1.3  →  sign +1</text>
<line x1="705" y1="218" x2="750" y2="218" stroke="#9fb0bf" stroke-width="2"/>
<line x1="355" y1="298" x2="390" y2="298" stroke="#9fb0bf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="268" width="315" height="60" rx="12" fill="#fff" stroke="#d9e3ec"/>
<text x="410" y="293" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26384b" font-weight="700">Rain vs rest</text>
<text x="410" y="315" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >score −0.4  →  sign −1</text>
<line x1="705" y1="298" x2="750" y2="298" stroke="#9fb0bf" stroke-width="2"/>
<line x1="355" y1="378" x2="390" y2="378" stroke="#9fb0bf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="348" width="315" height="60" rx="12" fill="#fff" stroke="#d9e3ec"/>
<text x="410" y="373" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26384b" font-weight="700">Snow vs rest</text>
<text x="410" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" >score −1.5  →  sign −1</text>
<line x1="705" y1="378" x2="750" y2="378" stroke="#9fb0bf" stroke-width="2"/>
<line x1="750" y1="138" x2="750" y2="378" stroke="#9fb0bf" stroke-width="2"/>
<line x1="750" y1="249" x2="790" y2="249" stroke="#41566d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="929" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526273" text-anchor="middle">Highest score</text>
<rect x="790" y="207" width="278" height="86" rx="14" fill="#eaf7ef" stroke="#2e9867"/>
<text x="929" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526273" text-anchor="middle">Selected class</text>
<text x="929" y="271" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#227d56" font-weight="700" text-anchor="middle">Cloudy</text>
</svg>
