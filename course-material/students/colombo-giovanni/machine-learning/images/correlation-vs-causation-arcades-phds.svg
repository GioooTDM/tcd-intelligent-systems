<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="110" y="86" fill="#172033" font-size="48" font-weight="700">Do arcades create computer scientists?</text>
    <text x="110" y="132" fill="#172033" font-size="24">Arcade revenue and CS doctorates moved together from 2000–2009</text>
    <text x="110" y="169" fill="#5b6475" font-size="20">A strong association is real, but it does not show that either variable caused the other.</text>

    <rect x="1115" y="55" width="375" height="108" rx="18" fill="#f5f7fb" stroke="#d9dee8" stroke-width="2"/>
    <text x="1302" y="99" text-anchor="middle" fill="#172033" font-size="25" font-weight="700">Pearson r = 0.985</text>
    <text x="1302" y="134" text-anchor="middle" fill="#5b6475" font-size="17">Correlation ≠ causation</text>

    <g font-size="17" font-weight="600">
      <line x1="180" y1="225" x2="240" y2="225" stroke="#2563eb" stroke-width="6"/>
      <circle cx="210" cy="225" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
      <text x="258" y="232" fill="#172033">Arcade revenue (USD billions)</text>

      <line x1="585" y1="225" x2="645" y2="225" stroke="#ea580c" stroke-width="6"/>
      <rect x="638" y="218" width="14" height="14" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
      <text x="668" y="232" fill="#172033">Computer science doctorates awarded</text>
    </g>

    <g stroke="#d9dee8" stroke-width="1.5">
      <line x1="180" y1="300" x2="1420" y2="300"/>
      <line x1="180" y1="397.5" x2="1420" y2="397.5"/>
      <line x1="180" y1="495" x2="1420" y2="495"/>
      <line x1="180" y1="592.5" x2="1420" y2="592.5"/>
      <line x1="180" y1="690" x2="1420" y2="690"/>
    </g>

    <g stroke="#edf0f5" stroke-width="1">
      <line x1="180" y1="300" x2="180" y2="690"/>
      <line x1="318" y1="300" x2="318" y2="690"/>
      <line x1="456" y1="300" x2="456" y2="690"/>
      <line x1="593" y1="300" x2="593" y2="690"/>
      <line x1="731" y1="300" x2="731" y2="690"/>
      <line x1="869" y1="300" x2="869" y2="690"/>
      <line x1="1007" y1="300" x2="1007" y2="690"/>
      <line x1="1144" y1="300" x2="1144" y2="690"/>
      <line x1="1282" y1="300" x2="1282" y2="690"/>
      <line x1="1420" y1="300" x2="1420" y2="690"/>
    </g>

    <line x1="180" y1="300" x2="180" y2="690" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="1420" y1="300" x2="1420" y2="690" stroke="#ea580c" stroke-width="2.5"/>
    <line x1="180" y1="690" x2="1420" y2="690" stroke="#aeb7c6" stroke-width="2"/>

    <g fill="#2563eb" font-size="17" text-anchor="end">
      <text x="162" y="306">$1.9B</text>
      <text x="162" y="403.5">$1.7B</text>
      <text x="162" y="501">$1.5B</text>
      <text x="162" y="598.5">$1.3B</text>
      <text x="162" y="696">$1.1B</text>
    </g>
    <text x="50" y="505" transform="rotate(-90 50 505)" text-anchor="middle" fill="#2563eb" font-size="20" font-weight="700">U.S. arcade revenue</text>

    <g fill="#ea580c" font-size="17">
      <text x="1438" y="306">1,900</text>
      <text x="1438" y="403.5">1,600</text>
      <text x="1438" y="501">1,300</text>
      <text x="1438" y="598.5">1,000</text>
      <text x="1438" y="696">700</text>
    </g>
    <text x="1550" y="505" transform="rotate(90 1550 505)" text-anchor="middle" fill="#ea580c" font-size="20" font-weight="700">CS doctorates awarded</text>

    <g fill="#5b6475" font-size="16" text-anchor="middle">
      <text x="180" y="725">2000</text><text x="318" y="725">2001</text>
      <text x="456" y="725">2002</text><text x="593" y="725">2003</text>
      <text x="731" y="725">2004</text><text x="869" y="725">2005</text>
      <text x="1007" y="725">2006</text><text x="1144" y="725">2007</text>
      <text x="1282" y="725">2008</text><text x="1420" y="725">2009</text>
    </g>

    <polyline points="180,643 318,653 456,608 593,622 731,589 869,527 1007,446 1144,420 1282,347 1420,381"
      fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#2563eb" stroke-width="4">
      <circle cx="180" cy="643" r="7"/><circle cx="318" cy="653" r="7"/>
      <circle cx="456" cy="608" r="7"/><circle cx="593" cy="622" r="7"/>
      <circle cx="731" cy="589" r="7"/><circle cx="869" cy="527" r="7"/>
      <circle cx="1007" cy="446" r="7"/><circle cx="1144" cy="420" r="7"/>
      <circle cx="1282" cy="347" r="7"/><circle cx="1420" cy="381" r="7"/>
    </g>

    <polyline points="180,638 318,648 456,655 593,636 731,609 869,551 1007,445 1144,379 1282,337 1420,394"
      fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#ea580c" stroke-width="4">
      <rect x="173" y="631" width="14" height="14"/><rect x="311" y="641" width="14" height="14"/>
      <rect x="449" y="648" width="14" height="14"/><rect x="586" y="629" width="14" height="14"/>
      <rect x="724" y="602" width="14" height="14"/><rect x="862" y="544" width="14" height="14"/>
      <rect x="1000" y="438" width="14" height="14"/><rect x="1137" y="372" width="14" height="14"/>
      <rect x="1275" y="330" width="14" height="14"/><rect x="1413" y="387" width="14" height="14"/>
    </g>

    <rect x="1060" y="523" width="350" height="87" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="1083" y="556" fill="#9a3412" font-size="18" font-weight="700">Both series even dip in 2009.</text>
    <text x="1083" y="584" fill="#7c2d12" font-size="16">Still, neither trend establishes causality.</text>

    <text x="110" y="815" fill="#5b6475" font-size="15">Data: U.S. Census Bureau and National Science Foundation; values reproduced in PLOS ONE (2025), Table 1.</text>
  </g>
</svg>
