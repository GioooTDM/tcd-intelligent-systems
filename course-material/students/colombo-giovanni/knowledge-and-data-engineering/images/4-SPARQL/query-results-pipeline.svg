<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="620" viewBox="0 0 2100 620" role="img" aria-labelledby="title desc">
  <title id="title">SPARQL query and result pipeline</title>
  <desc id="desc">The WHERE clause contains two terms denoting URIs, ex:Sharknado and ex:stars, and one variable, ?star. The schematic data graph shows two matching links. The result panel shows a SELECT table, an RDF graph returned by CONSTRUCT or DESCRIBE, and XML, JSON, CSV, or TSV serialisations of the table.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <marker id="triple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="match-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="data-match-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#16a34a"/>
    </marker>
    <marker id="context-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <style>
      .stage { font: 700 24px Arial, sans-serif; fill: #1e3a5f; }
      .subhead { font: 700 17px Arial, sans-serif; fill: #334155; }
      .code { font: 17px Menlo, Consolas, monospace; fill: #172033; }
      .node { font: 600 16px Arial, sans-serif; fill: #172033; }
      .edge { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .table { font: 15px Arial, sans-serif; fill: #172033; }
      .variable { fill: #0369a1; font-weight: 700; }
      .query-variable { font-weight: 800; stroke: #0369a1; stroke-width: 0.35px; paint-order: stroke fill; }
    </style>
  </defs>
  <rect width="2100" height="620" fill="#ffffff"/>

  <!-- Stage panels -->
  <rect x="35" y="115" width="380" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="500" y="115" width="1080" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="1665" y="115" width="400" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="225" y="67" text-anchor="middle" class="stage">1. WHERE pattern</text>
  <text x="1040" y="67" text-anchor="middle" class="stage">2. Match the graph pattern</text>
  <text x="1865" y="67" text-anchor="middle" class="stage">3. Query results</text>

  <!-- Flow arrows between stages -->
  <line x1="425" y1="330" x2="485" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <line x1="1590" y1="330" x2="1650" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- WHERE pattern -->
  <text x="65" y="155" class="subhead">Find Sharknado's stars</text>
  <rect x="62" y="185" width="326" height="175" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="88" y="228" class="code">WHERE {</text>
  <text x="88" y="286" class="code" style="font-size:16px"><tspan>ex:Sharknado ex:stars </tspan><tspan class="variable query-variable">?star</tspan><tspan> .</tspan></text>
  <text x="88" y="340" class="code">}</text>
  <rect x="62" y="390" width="326" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="84" y="427" class="subhead">URIs and variables</text>
  <text x="84" y="461" class="small">ex:Sharknado and ex:stars denote URIs.</text>
  <text x="84" y="484" class="small"><tspan class="variable">?star</tspan><tspan> is a variable, not a URI.</tspan></text>

  <!-- First compare the unbound graph pattern with the data graph -->
  <g transform="translate(0 -15)">
  <text x="735" y="175" text-anchor="middle" class="subhead">Graph pattern</text>
  <text x="1280" y="175" text-anchor="middle" class="subhead">Data graph: two matches</text>
  <rect x="520" y="205" width="430" height="300" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1000" y="205" width="560" height="300" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="954" y1="350" x2="994" y2="350" stroke="#64748b" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Pattern: ?star is still a variable, not a result value -->
  <line x1="703" y1="350" x2="833" y2="350" stroke="#16a34a" stroke-width="3.5" marker-end="url(#match-arrow)"/>
  <text x="769" y="337" text-anchor="middle" class="edge">ex:stars</text>
  <rect x="545" y="316" width="150" height="68" rx="8" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="620" y="356" text-anchor="middle" class="node">ex:Sharknado</text>
  <rect x="840" y="316" width="90" height="68" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="885" y="356" text-anchor="middle" class="node variable">?star</text>

  <!-- Schematic data graph: only the matching nodes and links reuse the pattern colours -->
  <path d="M 1109 248 C 1130 263, 1136 296, 1147 315" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#context-arrow)"/>
  <path d="M 1109 421 C 1130 405, 1136 360, 1147 337" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#context-arrow)"/>
  <path d="M 1215 346 C 1218 391, 1232 424, 1250 450" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#context-arrow)"/>
  <path d="M 1465 248 C 1484 264, 1490 298, 1497 326" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#context-arrow)"/>
  <path d="M 1465 410 C 1484 392, 1490 360, 1497 339" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#context-arrow)"/>
  <path d="M 1275 316 C 1324 297, 1335 248, 1377 248" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#data-match-arrow)"/>
  <path d="M 1275 334 C 1324 352, 1335 410, 1377 410" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#data-match-arrow)"/>
  <rect x="1045" y="234" width="64" height="28" rx="6" fill="#ef4444"/>
  <rect x="1045" y="407" width="64" height="28" rx="6" fill="#ef4444"/>
  <rect x="1220" y="451" width="64" height="26" rx="6" fill="#ef4444"/>
  <rect x="1505" y="318" width="43" height="28" rx="6" fill="#ef4444"/>
  <rect x="1155" y="304" width="120" height="42" rx="8" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <rect x="1385" y="230" width="80" height="36" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <rect x="1385" y="392" width="80" height="36" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- A and B are result shapes; C and D are table serialisations -->
  <rect x="1685" y="130" width="360" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1705" y="158" class="subhead">A. SELECT → table</text>
  <rect x="1705" y="173" width="320" height="29" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1720" y="193" class="table" font-weight="700">?star</text>
  <rect x="1705" y="202" width="320" height="29" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1720" y="222" class="table">ex:JohnHeard</text>
  <rect x="1705" y="231" width="320" height="29" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1720" y="251" class="table">ex:IanZiering</text>

  <rect x="1685" y="280" width="360" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1705" y="308" class="subhead">B. New RDF graph</text>
  <text x="1705" y="329" class="small">CONSTRUCT / DESCRIBE</text>
  <rect x="1720" y="350" width="90" height="32" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1765" y="371" text-anchor="middle" class="small">subject</text>
  <rect x="1920" y="350" width="90" height="32" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1965" y="371" text-anchor="middle" class="small">object</text>
  <line x1="1810" y1="366" x2="1912" y2="366" stroke="#334155" stroke-width="2" marker-end="url(#triple-arrow)"/>
  <text x="1861" y="351" text-anchor="middle" class="small">predicate</text>

  <rect x="1685" y="398" width="360" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1705" y="430" class="subhead">C. XML</text>
  <text x="1840" y="430" class="code" style="font-size:14px">&lt;result&gt;…&lt;/result&gt;</text>

  <rect x="1685" y="466" width="360" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1705" y="493" class="subhead">D. JSON / CSV / TSV</text>
</svg>
