<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" viewBox="0 0 1360 660" role="img" aria-labelledby="title desc">
  <title id="title">Expanded Sharknado RDF graph</title>
  <desc id="desc">The Sharknado series links to Sharknado and Sharknado 2. Both are movies. John Heard and Ian Ziering are people. The star relationships connect Sharknado to both actors and Sharknado 2 to Ian Ziering.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .resource { font: 600 20px Arial, sans-serif; fill: #172033; }
      .class { font: 600 19px Arial, sans-serif; fill: #172033; }
      .edge { font: 17px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1360" height="660" fill="#ffffff"/>

  <!-- Series-to-movie relationships -->
  <line x1="310" y1="382" x2="460" y2="222" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="310" y1="418" x2="460" y2="552" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- Type relationships -->
  <line x1="185" y1="435" x2="185" y2="491" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="585" y1="260" x2="585" y2="342" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="585" y1="550" x2="585" y2="418" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="1055" y1="260" x2="1055" y2="342" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="1055" y1="550" x2="1055" y2="418" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- Star relationships queried in the example -->
  <line x1="710" y1="225" x2="940" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <path d="M 710 245 C 790 305, 850 445, 940 570" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="710" y1="585" x2="940" y2="585" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- Predicate labels -->
  <rect x="322" y="280" width="120" height="28" rx="7" fill="#ffffff"/>
  <text x="382" y="300" text-anchor="middle" class="edge">ex:firstMovie</text>
  <rect x="326" y="492" width="136" height="28" rx="7" fill="#ffffff"/>
  <text x="394" y="512" text-anchor="middle" class="edge">ex:secondMovie</text>

  <rect x="198" y="447" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="241" y="466" text-anchor="middle" class="edge">rdf:type</text>
  <rect x="597" y="285" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="640" y="304" text-anchor="middle" class="edge">rdf:type</text>
  <rect x="597" y="462" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="640" y="481" text-anchor="middle" class="edge">rdf:type</text>
  <rect x="1067" y="285" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="1110" y="304" text-anchor="middle" class="edge">rdf:type</text>
  <rect x="1067" y="462" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="1110" y="481" text-anchor="middle" class="edge">rdf:type</text>

  <rect x="777" y="202" width="100" height="28" rx="7" fill="#ffffff"/>
  <text x="827" y="222" text-anchor="middle" class="edge">ex:stars</text>
  <rect x="787" y="398" width="100" height="28" rx="7" fill="#ffffff"/>
  <text x="837" y="418" text-anchor="middle" class="edge">ex:stars</text>
  <rect x="777" y="562" width="100" height="28" rx="7" fill="#ffffff"/>
  <text x="827" y="582" text-anchor="middle" class="edge">ex:stars</text>

  <!-- Class nodes -->
  <rect x="60" y="500" width="250" height="70" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="185" y="542" text-anchor="middle" class="class">ex:Series</text>
  <rect x="470" y="350" width="230" height="68" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="585" y="391" text-anchor="middle" class="class">ex:Movie</text>
  <rect x="955" y="350" width="200" height="68" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1055" y="391" text-anchor="middle" class="class">ex:Person</text>

  <!-- Resource nodes -->
  <rect x="60" y="365" width="250" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="408" text-anchor="middle" class="resource">ex:SharknadoSeries</text>
  <rect x="460" y="190" width="250" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="233" text-anchor="middle" class="resource">ex:Sharknado</text>
  <rect x="460" y="550" width="250" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="593" text-anchor="middle" class="resource">ex:Sharknado2</text>
  <rect x="940" y="190" width="230" height="70" rx="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1055" y="233" text-anchor="middle" class="resource">ex:JohnHeard</text>
  <rect x="940" y="550" width="230" height="70" rx="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1055" y="593" text-anchor="middle" class="resource">ex:IanZiering</text>
</svg>
