<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">A class's topping is not inherited by its instances</title>
  <desc id="desc">The stated triples say that pizza1 is an instance of PizzaMargarita and that the PizzaMargarita class resource hasTopping tomato. RDFS does not infer that pizza1 hasTopping tomato.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #172033; }
      .role { font: 600 17px Arial, sans-serif; fill: #475569; }
      .node { font: 700 21px Arial, sans-serif; fill: #172033; }
      .edge { font: 600 18px Arial, sans-serif; fill: #334155; }
      .warning { font: 700 19px Arial, sans-serif; fill: #b45309; }
      .statement { font: 18px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="heading">A statement about the class does not apply to every pizza</text>
  <rect x="45" y="72" width="1110" height="365" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="190" y="245" text-anchor="middle" class="role">Individual pizza</text>
  <rect x="80" y="260" width="220" height="74" rx="37" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="304" text-anchor="middle" class="node">ex:pizza1</text>

  <text x="595" y="132" text-anchor="middle" class="role">Class resource</text>
  <rect x="445" y="147" width="300" height="74" rx="16" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="595" y="191" text-anchor="middle" class="node">ex:PizzaMargarita</text>

  <text x="1005" y="132" text-anchor="middle" class="role">Tomato topping</text>
  <rect x="895" y="147" width="220" height="74" rx="37" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1005" y="191" text-anchor="middle" class="node">ex:tomato</text>

  <path d="M 300 284 C 365 278, 382 190, 435 184" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="219" width="100" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="243" text-anchor="middle" class="edge">rdf:type</text>

  <line x1="745" y1="184" x2="885" y2="184" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="751" y="133" width="128" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="815" y="159" text-anchor="middle" class="edge">ex:hasTopping</text>

  <rect x="286" y="353" width="628" height="64" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="378" text-anchor="middle" class="warning">Not inferred for ex:pizza1</text>
  <text x="600" y="405" text-anchor="middle" class="statement">ex:pizza1 ex:hasTopping ex:tomato .</text>
</svg>
