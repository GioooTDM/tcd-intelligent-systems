<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Multiple inheritance in RDFS</title>
  <desc id="desc">TeachingAssistant is a subclass of both Student and Employee. Alice is an instance of TeachingAssistant, so an RDFS reasoner infers that Alice is also a Student and an Employee.</desc>

  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #172033; }
      .node { font: 700 21px Arial, sans-serif; fill: #172033; }
      .edge { font: 600 18px Arial, sans-serif; fill: #334155; }
      .inferred { font: 700 17px Arial, sans-serif; fill: #c2410c; }
      .legend { font: 17px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="heading">Multiple inheritance in RDFS</text>
  <rect x="45" y="70" width="1110" height="500" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Class nodes -->
  <rect x="135" y="105" width="230" height="72" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="148" text-anchor="middle" class="node">ex:Student</text>

  <rect x="835" y="105" width="230" height="72" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="148" text-anchor="middle" class="node">ex:Employee</text>

  <rect x="455" y="270" width="290" height="76" rx="16" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="315" text-anchor="middle" class="node">ex:TeachingAssistant</text>

  <!-- Individual node -->
  <rect x="495" y="450" width="210" height="72" rx="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="493" text-anchor="middle" class="node">ex:alice</text>

  <!-- Subclass relationships -->
  <line x1="510" y1="270" x2="320" y2="182" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <rect x="326" y="201" width="158" height="35" rx="10" fill="#ffffff"/>
  <text x="405" y="225" text-anchor="middle" class="edge">rdfs:subClassOf</text>

  <line x1="690" y1="270" x2="880" y2="182" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <rect x="716" y="201" width="158" height="35" rx="10" fill="#ffffff"/>
  <text x="795" y="225" text-anchor="middle" class="edge">rdfs:subClassOf</text>

  <!-- Direct type relationship -->
  <line x1="600" y1="450" x2="600" y2="356" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <rect x="615" y="381" width="90" height="35" rx="10" fill="#ffffff"/>
  <text x="660" y="405" text-anchor="middle" class="edge">rdf:type</text>

  <!-- Inferred types -->
  <path d="M 495 486 C 250 470, 105 330, 215 182" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
  <rect x="112" y="327" width="174" height="38" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="199" y="352" text-anchor="middle" class="inferred">rdf:type — inferred</text>

  <path d="M 705 486 C 950 470, 1095 330, 985 182" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
  <rect x="914" y="327" width="174" height="38" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1001" y="352" text-anchor="middle" class="inferred">rdf:type — inferred</text>

  <!-- Legend -->
  <line x1="355" y1="548" x2="425" y2="548" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="440" y="554" class="legend">stated triple</text>
  <line x1="630" y1="548" x2="700" y2="548" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
  <text x="715" y="554" class="legend">inferred triple</text>
</svg>
