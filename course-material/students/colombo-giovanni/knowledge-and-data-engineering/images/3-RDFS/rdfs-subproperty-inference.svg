<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Inference from an RDFS subproperty</title>
  <desc id="desc">The stated relation ex:ownsBicycle rdfs:subPropertyOf ex:ownsVehicle means that ex:marco ex:ownsBicycle ex:bike1 implies ex:marco ex:ownsVehicle ex:bike1. The inferred edge is dashed.</desc>
  <defs>
    <marker id="arrow-stated" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-inferred" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #172033; }
      .node { font: 700 21px Arial, sans-serif; fill: #172033; }
      .edge { font: 600 19px Arial, sans-serif; fill: #334155; }
      .inferred { font: 600 19px Arial, sans-serif; fill: #c2410c; }
      .section { font: 700 18px Arial, sans-serif; fill: #475569; }
      .legend { font: 17px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="heading">A subproperty also implies its parent property</text>
  <rect x="45" y="75" width="1110" height="455" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="600" y="119" text-anchor="middle" class="section">Property hierarchy</text>
  <rect x="115" y="178" width="300" height="72" rx="36" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="265" y="221" text-anchor="middle" class="node">ex:ownsBicycle</text>
  <rect x="785" y="178" width="300" height="72" rx="36" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="935" y="221" text-anchor="middle" class="node">ex:ownsVehicle</text>
  <line x1="415" y1="214" x2="775" y2="214" stroke="#334155" stroke-width="3" marker-end="url(#arrow-stated)"/>
  <rect x="492" y="168" width="216" height="36" rx="10" fill="#ffffff"/>
  <text x="600" y="193" text-anchor="middle" class="edge">rdfs:subPropertyOf</text>

  <text x="600" y="310" text-anchor="middle" class="section">Statements about Marco and his bicycle</text>
  <rect x="100" y="365" width="215" height="90" rx="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="207" y="418" text-anchor="middle" class="node">ex:marco</text>
  <rect x="885" y="365" width="215" height="90" rx="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="992" y="418" text-anchor="middle" class="node">ex:bike1</text>

  <path d="M 315 388 C 475 335, 725 335, 875 388" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow-stated)"/>
  <rect x="470" y="329" width="260" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="355" text-anchor="middle" class="edge">ex:ownsBicycle</text>

  <path d="M 315 434 C 475 496, 725 496, 875 434" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-inferred)"/>
  <rect x="465" y="465" width="270" height="38" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="600" y="491" text-anchor="middle" class="inferred">ex:ownsVehicle (inferred)</text>

  <line x1="350" y1="552" x2="420" y2="552" stroke="#334155" stroke-width="3" marker-end="url(#arrow-stated)"/>
  <text x="435" y="558" class="legend">stated triple</text>
  <line x1="630" y1="552" x2="700" y2="552" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-inferred)"/>
  <text x="715" y="558" class="legend">inferred triple</text>
</svg>
