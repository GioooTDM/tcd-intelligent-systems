<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Weak structural constraints in RDF</title>
  <desc id="desc">An RDF graph is syntactically valid but uses a predicate in a semantically inappropriate way by assigning a surname to a router.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #172033; }
      .card-title { font: 700 21px Arial, sans-serif; fill: #172033; }
      .role { font: 600 16px Arial, sans-serif; fill: #64748b; }
      .node { font: 700 20px Arial, sans-serif; fill: #172033; }
      .edge { font: 600 18px Arial, sans-serif; fill: #334155; }
      .valid { font: 700 17px Arial, sans-serif; fill: #15803d; }
      .warning { font: 700 17px Arial, sans-serif; fill: #b91c1c; }
      .note { font: 18px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="heading">Valid RDF syntax does not guarantee sensible meaning</text>

  <rect x="150" y="80" width="900" height="330" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" class="card-title">A router with a surname</text>

  <text x="300" y="164" text-anchor="middle" class="role">subject</text>
  <text x="600" y="164" text-anchor="middle" class="role">predicate</text>
  <text x="900" y="164" text-anchor="middle" class="role">object</text>

  <rect x="210" y="190" width="180" height="64" rx="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="229" text-anchor="middle" class="node">ex:router1</text>

  <line x1="390" y1="222" x2="800" y2="222" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="510" y="184" width="180" height="36" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="208" text-anchor="middle" class="edge">ex:hasSurname</text>

  <rect x="810" y="190" width="180" height="64" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="900" y="229" text-anchor="middle" class="node">"Murphy"</text>

  <rect x="330" y="290" width="540" height="84" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="324" text-anchor="middle" class="valid">✓ Syntactically valid RDF triple</text>
  <text x="600" y="354" text-anchor="middle" class="warning">✕ Semantically inappropriate use</text>

  <rect x="110" y="438" width="980" height="50" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="470" text-anchor="middle" class="note">RDF alone does not specify which subjects and objects are appropriate for a property.</text>
</svg>
